<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AIRway · Super Admin</title>
<style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#102b24;font-family:Inter,system-ui,sans-serif;color:#17211d}.login{width:min(420px,calc(100% - 32px));background:#fff;border-radius:20px;padding:36px;box-shadow:0 24px 70px #061a1470}.brand{display:flex;align-items:center;gap:10px;font-size:21px;font-weight:850;margin-bottom:30px}.mark{width:39px;height:39px;border-radius:12px;background:#c7f36b;display:grid;place-items:center;color:#173324}.eyebrow{font-size:10px;letter-spacing:1.5px;color:#77847c;font-weight:800;text-transform:uppercase}h1{font-size:25px;margin:8px 0}.muted{font-size:13px;color:#7a8780;line-height:1.6;margin-bottom:25px}label{display:block;font-size:12px;font-weight:700;margin:16px 0 7px}input{width:100%;padding:13px;border:1px solid #dce5de;border-radius:9px;font:inherit;outline:none}input:focus{border-color:#527b61;box-shadow:0 0 0 3px #527b6118}button{width:100%;padding:13px;border:0;border-radius:9px;background:#173c30;color:white;font-size:13px;font-weight:800;margin-top:22px;cursor:pointer}.error{padding:11px;border-radius:8px;background:#fff0ef;color:#a33d36;font-size:12px;line-height:1.5}.foot{font-size:11px;color:#95a098;text-align:center;margin-top:22px}</style></head>
<body><main class="login"><div class="brand"><span class="mark">A</span>AIRway</div><div class="eyebrow">Secure workspace</div><h1>Welcome back</h1><p class="muted">Sign in with your Super Admin phone number and password to manage AIRway operations.</p>
{% if error %}<div class="error">{{ error }}</div>{% endif %}
<form method="post">{% csrf_token %}<label for="phone">Admin phone number</label><input id="phone" name="phone" type="tel" autocomplete="username" placeholder="+91XXXXXXXXXX" required autofocus><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" placeholder="Enter your password" required><button type="submit">Sign in to dashboard</button></form>
<div class="foot">Restricted access · Authorized Super Admin only</div></main></body></html>
