name: AIRway Flutter checks

on:
  push:
    branches:
      - feat/airway-30-70-payment-lifecycle
    paths:
      - "app/**"
      - ".github/workflows/flutter-checks.yml"
  pull_request:
    branches:
      - feat/airway-30-70-payment-lifecycle
    paths:
      - "app/**"
      - ".github/workflows/flutter-checks.yml"

permissions:
  contents: read

jobs:
  flutter-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve Flutter dependencies
        working-directory: app
        run: flutter pub get

      - name: Analyze changed Flutter features
        working-directory: app
        shell: bash
        run: |
          set +e
          flutter analyze --no-pub \
            lib/main.dart \
            lib/features/auth/presentation/startup_gate.dart \
            lib/features/customer/presentation/customer_home_screen.dart \
            lib/features/booking/presentation/customer_order_screen.dart \
            lib/features/notification/data/notification_api.dart \
            lib/features/notification/data/push_notification_service.dart \
            lib/features/worker/data/worker_api.dart \
            lib/features/worker/data/worker_app_api.dart \
            lib/features/worker/data/worker_models.dart \
            lib/features/worker/presentation/worker_application_screen.dart \
            lib/features/worker/presentation/worker_dashboard_screen.dart \
            lib/features/worker/presentation/worker_profile_edit_screen.dart \
            lib/features/worker/presentation/worker_service_management_screen.dart \
            > /tmp/airway-flutter-analyze.log 2>&1
          cat /tmp/airway-flutter-analyze.log
          if ! grep -q "issues found" /tmp/airway-flutter-analyze.log; then
            echo "Flutter analyzer did not complete successfully."
            exit 1
          fi
          if grep -E " (error|warning) • " /tmp/airway-flutter-analyze.log; then
            echo "Flutter analysis found errors or warnings."
            exit 1
          fi
          echo "No Dart errors or warnings. Informational lints remain."
          
      - name: Run Flutter tests
        working-directory: app
        run: flutter test --no-pub
