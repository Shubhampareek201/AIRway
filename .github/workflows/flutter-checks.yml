name: AIRway Flutter checks

on:
  push:
    branches:
      - feat/airway-30-70-payment-lifecycle
    paths:
      - "app/**"
      - ".github/workflows/flutter-checks.yml"
  pull_request:
    branches:
      - feat/airway-30-70-payment-lifecycle
    paths:
      - "app/**"
      - ".github/workflows/flutter-checks.yml"

permissions:
  contents: read

jobs:
  flutter-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve Flutter dependencies
        working-directory: app
        run: flutter pub get

      - name: Analyze the complete Flutter application
        working-directory: app
        shell: bash
        run: |
          set +e
          flutter analyze --no-pub > /tmp/airway-flutter-analyze.log 2>&1
          analyze_status=$?
          cat /tmp/airway-flutter-analyze.log
          if ! grep -q "issues found" /tmp/airway-flutter-analyze.log; then
            echo "Flutter analyzer did not complete successfully (exit $analyze_status)."
            exit 1
          fi
          if grep -E " error • " /tmp/airway-flutter-analyze.log; then
            echo "Full-project Flutter analysis found errors."
            exit 1
          fi
          echo "No Dart errors. Any warnings or informational lints are reported above for follow-up."

      - name: Run Flutter tests
        working-directory: app
        run: flutter test --no-pub
